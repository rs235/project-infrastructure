---
name: Home - Ansible Apply - kubernetes

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "ansible/inventories/home/**"
  #     - "ansible/playbooks/kubernetes.yml"
  #     - "ansible/roles/**"
  #     - "ansible/requirements.yml"
  #     - "ansible/ansible.cfg"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-apply-kubernetes:
    uses: ./.github/workflows/reusable-ansible-apply.yml
    with:
      working-directory: ansible
      concurrency-group: home-kubernetes
      runner: '["self-hosted", "Linux", "X64", "infra", "home"]'
      environment: home
      ansible-playbook: kubernetes
      ansible-inventory-group: k8s_cluster

    secrets:
      ansible_ssh_private_key: ${{ secrets.HOME_ANSIBLE_SSH_PRIVATE_KEY }}
      ansible_vault_password: ${{ secrets.HOME_ANSIBLE_VAULT_PASSWORD }}
