---
- name: Systemd daemon reload
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Systemd enable pve-exporter
  ansible.builtin.systemd_service:
    name: pve-exporter
    enabled: true

- name: Systemd restart pve-exporter
  ansible.builtin.systemd_service:
    name: pve-exporter
    state: restarted
