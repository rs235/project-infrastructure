---
- name: Ensure dependencies are installed
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: true
    cache_valid_time: 604800

- name: Install prometheus-pve-exporter
  ansible.builtin.pip:
    name: prometheus-pve-exporter=={{ pve_exporter_version }}
    state: present
    virtualenv: /opt/prometheus-pve-exporter/venv
    virtualenv_command: python3 -m venv

- name: Install systemd service
  ansible.builtin.template:
    src: pve-exporter.service.j2
    dest: /etc/systemd/system/pve-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Systemd daemon reload
    - Systemd enable pve-exporter
    - Systemd restart pve-exporter

- name: Create config directory
  ansible.builtin.file:
    path: /etc/prometheus
    state: directory
    owner: pve-exporter
    group: pve-exporter
    mode: "0550"

- name: Create config file
  ansible.builtin.template:
    src: pve.yml.j2
    dest: /etc/prometheus/pve.yml
    owner: pve-exporter
    group: pve-exporter
    mode: "0540"
  notify:
    - Systemd restart pve-exporter
